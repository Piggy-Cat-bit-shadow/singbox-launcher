name: CI/CD (macOS only)

# ==============================================================================
# Fork-local workflow: macOS only.
#
# This fork is used on a single Apple Silicon Mac, so only the macOS pipeline
# is kept. Windows (Win64, Win7, installer) and Linux/Ubuntu jobs were removed
# to stop spending Actions minutes on platforms this fork never ships.
# The cross-platform SOURCE support is untouched — only CI scope changed.
#
# Jobs:
#   Meta        version/channel computation
#   Test macOS  go mod download + build/test_darwin.sh
#   Build macOS Universal .app + Catalina (Intel-only) .app, uploaded as artifacts
#   Release     macOS packages only, when a tag is pushed or run_mode=prerelease
#
# Scenarios:
#
# 1) Stable Release (manual tag)
#   git tag v0.6.1 && git push origin v0.6.1
#   -> full build, GitHub Release created, prerelease = false
#
# 2) Pre-release (manual trigger)
#   gh workflow run ci.yml --ref <branch> -f run_mode=prerelease -f skip_tests=true
#   -> version = git describe --exclude='*-prerelease' + -prerelease, tag pushed,
#      GitHub Pre-release created
#
# 3) Build only (no release, no tag)
#   gh workflow run ci.yml --ref <branch> -f run_mode=build -f skip_tests=false
#   -> macOS artifacts uploaded; no tag, no release
#
# Notes:
# - push to main  -> tests only
# - pull request  -> tests only
# - workflow_dispatch controls manual behavior
# - Tags with prefix v.dev.* are CI-generated and are not stable releases.
# ==============================================================================

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_mode:
        description: "tests | build | prerelease"
        required: true
        default: "tests"
        type: choice
        options: [ tests, build, prerelease ]
      skip_tests:
        description: "Skip tests (only for build/prerelease)"
        required: false
        default: false
        type: boolean

# Default permission: read-only. Release job overrides to contents: write.
permissions:
  contents: read

jobs:
  meta:
    name: Meta
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.run_mode == 'build' || github.event.inputs.run_mode == 'prerelease'))
    runs-on: macos-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version and channel
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          # Stable tag trigger
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Version: $VERSION"
            exit 0
          fi

          RUN_MODE="${{ github.event.inputs.run_mode }}"

          if [[ "$RUN_MODE" == "prerelease" ]]; then
            DESCRIBE_RAW="$(git describe --tags --always --exclude='*-prerelease')"
            DEV_TAG="${DESCRIBE_RAW}-prerelease"
            echo "version=$DEV_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "tag=$DEV_TAG" >> "$GITHUB_OUTPUT"
            echo "Version: $DEV_TAG"
            echo "Channel: prerelease"
          else
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            BRANCH_RAW="${GITHUB_REF_NAME}"
            BRANCH_SANITIZED="$(echo "$BRANCH_RAW" | tr '/ ' '--' | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
            VERSION="dev.${BRANCH_SANITIZED}.${SHORT_SHA}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=build" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Version: $VERSION"
            echo "Channel: build"
          fi

  test:
    name: Test macOS
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request')
      || (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.run_mode == 'tests' ||
           ((github.event.inputs.run_mode == 'build' || github.event.inputs.run_mode == 'prerelease')
             && github.event.inputs.skip_tests != 'true')))
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests (macOS)
        env:
          CGO_ENABLED: 1
        shell: bash
        run: |
          bash build/test_darwin.sh nopause

      # Tooling guards that are platform-independent static checks. They used to
      # run in the Ubuntu leg; macOS runs them just as well and they are worth
      # keeping (they catch i18n drift and path-join violations before review).
      - name: L10n and paths checks
        shell: bash
        run: |
          go run ./tools/l10n/l10n_check --strict
          go run ./tools/l10n/hardcoded_check --strict
          go run ./tools/paths_guard --strict

      - name: Win7 (go1.20) constructs guard
        shell: bash
        continue-on-error: true
        run: |
          go run ./tools/win7guard

      - name: Check go mod tidy is clean
        shell: bash
        run: |
          set -euo pipefail
          echo "Running go mod tidy check..."
          go mod tidy
          if ! git diff --exit-code; then
            echo ""
            echo ":x: go.mod / go.sum are not tidy"
            echo "Please run locally: go mod tidy && git commit -am \"go mod tidy\""
            git diff
            exit 1
          fi
          echo ":white_check_mark: go.mod and go.sum are tidy"

  build-darwin:
    name: Build macOS
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.run_mode == 'build' || github.event.inputs.run_mode == 'prerelease'))
    needs: meta
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Export version and channel
        shell: bash
        run: |
          echo "Version: ${{ needs.meta.outputs.version }}"
          echo "Channel: ${{ needs.meta.outputs.channel }}"

      - name: Install dependencies
        run: go mod download

      - name: Verify C compiler (macOS)
        shell: bash
        continue-on-error: true
        run: |
          clang --version || echo "Warning: clang check failed, but continuing..."
          xcrun --show-sdk-path || echo "Warning: xcrun check failed, but continuing..."

      - name: Build macOS .app bundle (Universal)
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ./build/build_darwin.sh universal
          mkdir -p dist
          mv -f singbox-launcher.app dist/

      - name: Build macOS .app bundle (Catalina target, Intel-only)
        shell: bash
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          ./build/build_darwin.sh catalina
          mkdir -p dist
          if [ -d "singbox-launcher.app" ]; then
            mv -f singbox-launcher.app dist/singbox-launcher-macos-catalina.app
          else
            echo "Warning: catalina build did not produce singbox-launcher.app"
          fi

      - name: Upload Catalina artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-macos-catalina
          path: |
            dist/singbox-launcher-macos-catalina.app
            dist/singbox-launcher-macos-catalina.zip
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 30 }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: artifacts-darwin
          path: dist/*
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 30 }}


  release:
    name: Create Release
    needs: [meta, build-darwin]
    runs-on: macos-latest
    permissions:
      contents: write
    if: always() &&
        needs.meta.result == 'success' &&
        needs.build-darwin.result == 'success' &&
        (startsWith(github.ref, 'refs/tags/v') ||
         (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'prerelease'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # IMPORTANT: Create/push prerelease tag early (before uploading a release).
      - name: Create and push prerelease tag (workflow_dispatch prerelease)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode == 'prerelease'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.meta.outputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "Error: meta.outputs.tag is empty"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG"
          else
            git tag -a "$TAG" -m "prerelease $TAG"
            git push origin "$TAG"
            echo "Created and pushed tag: $TAG"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-artifacts

      - name: Create release packages
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts

          VERSION="${{ needs.meta.outputs.version }}"
          echo "=== Creating macOS release packages for version: $VERSION ==="
          echo ""

          echo "=== Cleaning up unwanted files/directories ==="
          if [ -d "logs" ]; then
            echo "Found logs directory, removing it..."
            rm -rf logs
          fi
          find . -name "*.log" -type f -delete 2>/dev/null || true
          find . -name "*.tmp" -type f -delete 2>/dev/null || true
          echo ""

          MACOS_APP=$(find . -name "singbox-launcher.app" -type d | head -1 || true)
          if [ -n "${MACOS_APP:-}" ]; then
            echo "Found singbox-launcher.app, creating ZIP..."
            zip -r "singbox-launcher-${VERSION}-macos.zip" "$MACOS_APP"
            echo "Created: singbox-launcher-${VERSION}-macos.zip"
          else
            echo "Warning: singbox-launcher.app not found"
          fi

          # Catalina-targeted (Intel-only, macOS 10.15+) build, when present.
          MACOS_APP_CATALINA=$(find . -name "singbox-launcher-macos-catalina.app" -type d | head -1 || true)
          if [ -n "${MACOS_APP_CATALINA:-}" ]; then
            echo "Found Catalina-targeted app, creating ZIP..."
            zip -r "singbox-launcher-${VERSION}-macos-catalina.zip" "$MACOS_APP_CATALINA"
            echo "Created: singbox-launcher-${VERSION}-macos-catalina.zip"
          fi

          echo ""
          echo "=== Creating checksums ==="
          find . -maxdepth 1 -name "singbox-launcher-${VERSION}-*.zip" -type f -size +0 -exec shasum -a 256 {} \; > checksums.txt
          if [ -f checksums.txt ] && [ -s checksums.txt ]; then
            echo "Checksums created:"
            cat checksums.txt
          else
            echo "Warning: checksums.txt is empty"
            : > checksums.txt
          fi

          echo ""
          echo "=== Files to upload ==="
          ls -lh singbox-launcher-${VERSION}-*.zip checksums.txt 2>/dev/null || true

      - name: Read release notes
        id: release_notes
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Slug: v0.8.7 -> 0-8-7;  v0.8.7-1-g50c7352-prerelease -> 0-8-7-1-g50c7352-prerelease
          SLUG="${VERSION#v}"
          SLUG="${SLUG//./-}"
          SRC="docs/release_notes/${SLUG}.md"

          # Prerelease fallback to upcoming.md when exact slug file is missing.
          # Rationale: prerelease slug embeds the HEAD short SHA via git describe,
          # but adding a release-notes commit shifts HEAD to a new SHA — so any
          # file you pre-create has a name based on parent's SHA, never matches
          # what CI computes on the post-commit HEAD. This is a structural
          # chicken-and-egg in the doc'd flow. Falling back to the canonical
          # upcoming.md draft makes prereleases usable without manual SHA
          # gymnastics. Stable releases (`vX.Y.Z` tag → SLUG=X-Y-Z) keep the
          # strict requirement: that file MUST exist.
          if [ ! -f "$SRC" ] && [ "$PRERELEASE" = "true" ] && [ -f "docs/release_notes/upcoming.md" ]; then
            echo "::notice::Prerelease release-notes file '$SRC' not found — falling back to docs/release_notes/upcoming.md (see RELEASE_PROCESS.md §2 chicken-and-egg note)."
            SRC="docs/release_notes/upcoming.md"
          fi

          if [ ! -f "$SRC" ]; then
            echo "::error file=$SRC::Release notes file not found for version '$VERSION'."
            echo "::error::Expected path: $SRC"
            echo "::error::Create this file BEFORE triggering the release. See docs/RELEASE_PROCESS.md."
            if [ "$PRERELEASE" = "true" ]; then
              echo "::error::Prerelease fallback also failed: docs/release_notes/upcoming.md is missing."
              echo "::error::Either populate upcoming.md OR pre-create the exact per-SHA file:"
              echo "::error::  VER=\"\$(git describe --tags --always --exclude='*-prerelease')-prerelease\""
              echo "::error::  SLUG=\"\${VER#v}\"; SLUG=\"\${SLUG//./-}\""
              echo "::error::  echo \"docs/release_notes/\${SLUG}.md\""
            fi
            exit 1
          fi

          echo "✓ Using release notes from: $SRC"

          NOTES_FILE="$(mktemp)"
          if [ "$PRERELEASE" = "true" ]; then
            # printf instead of heredoc — heredoc body un-indented inside a
            # YAML block scalar collides with YAML structural characters
            # (leading `>` parses as folded scalar, leading `---` as document
            # separator). printf keeps the script entirely on indented lines.
            printf '> :warning: **Pre-release build** off `%s` — for testing only, not for production. Use the latest stable release on the Releases page if you are not sure.\n\n---\n\n' "$VERSION" >> "$NOTES_FILE"
          fi
          cat "$SRC" >> "$NOTES_FILE"

          DELIMITER="RELEASE_NOTES_EOF_b8f0dt821h7"
          {
            echo "notes<<${DELIMITER}"
            cat "$NOTES_FILE"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"
          rm -f "$NOTES_FILE"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.channel }} ${{ needs.meta.outputs.version }}
          fail_on_unmatched_files: false
          body: |
            ## Release ${{ needs.meta.outputs.version }}

            ### Downloads

            #### macOS (Universal) - Supports both Apple Silicon and Intel

            **Option 1: Installation Script (Recommended)**

            Install with a single command (version ${{ needs.meta.outputs.version }}):
            ```bash
            curl -fsSL "https://raw.githubusercontent.com/Piggy-Cat-bit-shadow/singbox-launcher/main/scripts/install-macos.sh" | bash -s -- ${{ needs.meta.outputs.version }}
            ```

            The script downloads the release archive, extracts it to `/Applications/`,
            fixes quarantine attributes and permissions, and launches the app.

            **Option 2: Manual Installation**

            1. Download: `singbox-launcher-${{ needs.meta.outputs.version }}-macos.zip`
            2. Extract the ZIP file
            3. Remove the quarantine attribute:
               ```bash
               xattr -cr "singbox-launcher.app"
               ```
            4. Double-click `singbox-launcher.app` to run
               - If macOS blocks the app, use **System Settings -> Privacy & Security -> Open Anyway**

            #### macOS (Catalina, Intel-only)

            1. Download: `singbox-launcher-${{ needs.meta.outputs.version }}-macos-catalina.zip`
            2. Same installation steps as above; targets macOS 10.15+ on Intel Macs

            > This fork builds macOS only. Windows and Linux packages are not produced here.

            ### Checksums

            See `checksums.txt` for SHA256 checksums.

            ${{ steps.release_notes.outputs.notes }}
          files: |
            release-artifacts/singbox-launcher-${{ needs.meta.outputs.version }}-macos.zip
            release-artifacts/singbox-launcher-${{ needs.meta.outputs.version }}-macos-catalina.zip
            release-artifacts/checksums.txt
          # Publish immediately. RELEASE_PROCESS §1.6 / §2.4 promise the release is
          # ready out of the box (no manual un-draft step). Historical default was
          # `draft: true` from Feb 2026 when the release-notes pipeline was less
          # trustworthy and a maintainer needed to eyeball the body before
          # publishing. With per-version <slug>.md mandatory + the auto-banner for
          # prereleases, that gate is no longer earning its keep.
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease }}
