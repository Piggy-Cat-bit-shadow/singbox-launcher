name: golangci-lint

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  golangci-lint:
    # Fork-local: macOS only. The lint gate itself is worth keeping — it is a
    # static check, not a platform build — but running it three times (Linux,
    # macOS, Windows) spends minutes on platforms this fork never ships.
    name: golangci-lint (macOS)
    runs-on: macos-latest
    steps:
      # Event-safe checkout. On workflow_dispatch there is no pull_request
      # payload, so `github.event.pull_request.head.sha` is empty and checkout
      # would silently fall back to the repository default branch — a manual
      # lint run would then check a branch nobody asked about. The expression
      # below pins the PR head when a PR triggered the run and takes the
      # dispatched ref otherwise.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25
          cache: false

      - name: Verify Go Version
        run: go version

      - name: Setup Go environment
        run: |
          go env -w GOFLAGS="-buildvcs=false"

      - name: Update dependencies
        run: go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: `latest` silently turns new linter releases into red CI on
          # untouched code. Bump deliberately.
          version: v2.12.2
          args: --verbose
          skip-cache: true
        env:
          CGO_ENABLED: '1'
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true